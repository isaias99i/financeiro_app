
buildscript {
    repositories {
        google()  // Repositórios para o AGP e outras dependências
        mavenCentral()
    }
    dependencies {
        // Atualize o AGP para a versão mínima exigida pelo Flutter
        classpath 'com.android.tools.build:gradle:8.6.0' // Atualização aqui
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0' // Versão do Kotlin (se necessário)
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
